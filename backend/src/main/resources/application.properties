# 项目启动占用的端口号
server.port=8082
# 设置编码
server.tomcat.uri-encoding=utf-8
# url地址配置: localhost:8082/med
server.servlet.context-path=/med

#数据源 --加载驱动:
#如果mygsql版本5.* com.mysql.jdbc.Driver
#如果mygsql版本8.* com.mysql.cj.jdbc.Driver
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123
# 数据库链接地址:
spring.datasource.url=jdbc:mysql://127.0.0.1:3308/medicinesystem?characterEncoding=UTF-8&serverTimezone=GMT%2b8&useSSL=false&requireSSL=false
# 连接池配置
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource

# 找到所有映射文件: *.xml
mybatis.mapper-locations=mapping/*.xml

# json格式处理: jackson
spring.jackson.time-zone=GMT+8
# json数据时间格式
spring.jackson.date-format=yyyy-MM-dd
